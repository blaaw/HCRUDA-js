<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA - Iniciar sesión</title>
  <link rel="icon" type="image/jpeg" href="public/favicon.jpg" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/login.css" />
  <script src="js/utils.js"></script>
  <script src="js/pages/login.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <header class="login-header">
        <div class="login-logo nm-sign" style="--r: var(--r-lg);">
          <img src="public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Acceso al ERP/CRM hospitalario HCRUDA</p>
      </header>

      <form class="login-form" id="form-login" novalidate>
        <div class="field">
          <label for="usuario">Código de Usuario</label>
          <input
            type="email"
            id="usuario"
            name="usuario"
            placeholder="U001"
            required
            autocomplete="username"
          />
          <p class="field__error" id="error-usuario" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            minlength="6"
          />
          <p class="field__error" id="error-password" aria-live="polite"></p>
        </div>

        <button type="button" class="btn btn--primary" id="btn-login">
          Entrar
        </button>
      </form>

      <footer class="login-footer">
        ¿No tienes cuenta? <a href="pages/registro.html">Regístrate aquí</a>
      </footer>
    </div>
  </div>
</body>
</html>
