<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA — Registro</title>
  <link rel="icon" type="image/jpeg" href="../public/34a7e23742c910627feb9b92baabdf71.jpg" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/registro.css" />
  <script src="../js/utils.js"></script>
  <script src="../js/pages/registro.js"></script>
</head>
<body>
  <div class="registro-container">
    <div class="registro-card">
      <header class="registro-header">
        <div class="registro-logo nm-sign" style="--r: var(--r-lg);">
          <img src="../public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="registro-title">Crear cuenta</h1>
        <p class="registro-subtitle">Registro de usuario en HCRUDA</p>
      </header>

      <form class="registro-form" id="form-registro" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ana"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            autocomplete="given-name"
            minlength="2"
          />
          <p class="field__error" id="error-nombre" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="apellidos">Apellidos</label>
          <input
            type="text"
            id="apellidos"
            name="apellidos"
            placeholder="García López"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            autocomplete="family-name"
            minlength="2"
          />
          <p class="field__error" id="error-apellidos" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="dni">DNI</label>
          <input
            type="text"
            id="dni"
            name="dni"
            placeholder="12345678A"
            required
            pattern="^[0-9]{8}[A-Z]$"
            autocomplete="off"
            maxlength="9"
          />
          <p class="field__error" id="error-dni" aria-live="polite"></p>
          <p class="field__hint">Formato: 8 números seguidos de una letra mayúscula (ej. 12345678A)</p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="usuario@hospital.com"
            required
            autocomplete="email"
          />
          <p class="field__error" id="error-email" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="rol">Rol</label>
          <select id="rol" name="rol" required>
            <option value="">Selecciona un rol</option>
            <value="medico">Médico</option>
            <value="enfermero">Enfermero</option>
          </select>
          <p class="field__error" id="error-rol" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            minlength="6"
            autocomplete="new-password"
          />
          <p class="field__error" id="error-password" aria-live="polite"></p>
          <p class="field__hint">Mínimo 6 caracteres</p>
        </div>

        <div class="field">
          <label for="password-confirm">Confirmar contraseña</label>
          <input
            type="password"
            id="password-confirm"
            name="password-confirm"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
          <p class="field__error" id="error-password-confirm" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn btn--primary" id="btn-registro">
          Registrar
        </button>
      </form>

      <footer class="registro-footer">
        Ya tienes cuenta? <a href="../index.html">Inicia sesión aquí</a>
      </footer>
    </div>
  </div>
</body>
</html>
