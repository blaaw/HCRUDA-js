<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA — Panel principal</title>
  <link rel="icon" type="image/jpeg" href="../public/favicon.jpg" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/dashboard.css" />
  <script src="../js/utils.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Overlay del menú lateral -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Panel vertical de navegación -->
    <nav class="sidebar-panel" id="sidebar-panel">
      <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">✕</button>
      <ul class="sidebar-menu">
        <li><a href="citas.html" class="sidebar-link">Citas</a></li>
        <li><a href="pacientes.html" class="sidebar-link">Pacientes</a></li>
        <li><a href="doctores.html" class="sidebar-link">Doctores</a></li>
        <li><a href="tratamientos.html" class="sidebar-link">Tratamientos</a></li>
      </ul>
    </nav>

    <header class="dashboard-header">
      <div class="dashboard-brand">
        <button class="btn-hamburger" id="btn-hamburger" aria-label="Abrir menú de navegación">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <div class="dashboard-logo nm-sign" style="--r: var(--r-md);">
          <img src="../public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="dashboard-title">Panel principal</h1>
      </div>

      <div class="dashboard-user">
        <div class="dashboard-user__avatar" id="user__avatar">U</div>
        <div class="dashboard-user__info">
          <span class="dashboard-user__name" id="usuario-nombre">Usuario</span>
          <span class="dashboard-user__rol" id="usuario-rol">Rol</span>
        </div>
      </div>

      <button type="button" class="btn btn-logout" id="btn-logout">
        Cerrar sesión
      </button>
    </header>

    <!-- Grid 2x2: dos overview arriba, dos tablas abajo -->
    <div class="dashboard-grid">

      <!-- Overview: Citas -->
      <section class="overview citas-overview">
        <header class="overview-header">
          <h2 class="overview-title">Citas</h2>
        </header>
        <div class="citas-estados">
          <button type="button" class="estado-btn" id="btn-estado-pendiente">
            <span class="estado-btn__label">Pendientes</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-confirmada">
            <span class="estado-btn__label">Confirmadas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-completada">
            <span class="estado-btn__label">Completadas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-cancelada">
            <span class="estado-btn__label">Canceladas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-total">
            <span class="estado-btn__label">Todas</span>
          </button>
        </div>
        <div class="citas-total">
          <span class="citas-total__label">Total citas:</span>
          <span class="citas-total__numero" id="citas-total">10</span>
        </div>
      </section>

      <!-- Overview: Departamentos -->
      <section class="overview departamentos-overview">
        <header class="overview-header">
          <h2 class="overview-title">Departamentos</h2>
        </header>
        <div class="departamentos-list" id="departamentos-list">
          <!-- Se pinta con JS desde json/departamentos.json -->
        </div>
      </section>

      <!-- Tabla: Pacientes -->
      <section class="tabla-section pacientes-section">
        <header class="tabla-header">
          <h2 class="tabla-title">Pacientes</h2>
        </header>
        <div class="pacientes-filtros">
          <div class="filtro-buscar">
            <label for="buscar-paciente">Buscar por nombre</label>
            <input
              type="search"
              id="buscar-paciente"
              placeholder="Escribe nombre o apellido…"
              aria-label="Buscar paciente por nombre"
              class="input"
            />
          </div>
        </div>
        <div class="pacientes-tabla-wrap">
          <table id="tabla-pacientes" class="pacientes-tabla">
            <caption>Pacientes registrados</caption>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Tipo</th>
                <th>Tratamiento</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Tabla: Doctores -->
      <section class="tabla-section doctores-section">
        <header class="tabla-header">
          <h2 class="tabla-title">Doctores</h2>
        </header>
        <div class="doctores-filtros">
          <div class="filtro-buscar">
            <label for="buscar-doctor">Buscar por nombre</label>
            <input
              type="search"
              id="buscar-doctor"
              placeholder="Escribe nombre o apellido…"
              aria-label="Buscar doctor por nombre"
              class="input"
            />
          </div>
        </div>
        <div class="doctores-tabla-wrap">
          <table id="tabla-doctores" class="doctores-tabla">
            <caption>Doctores registrados</caption>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Especialidad</th>
                <th>Departamento</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </div>

</body>
</html>
