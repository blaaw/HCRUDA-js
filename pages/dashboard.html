<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA — Panel principal</title>
  <link rel="icon" type="image/jpeg" href="../public/favicon.jpg" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <div class="dashboard-logo nm-sign" style="--r: var(--r-md);">
          <img src="../public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="dashboard-title">Panel principal</h1>
      </div>

      <div class="dashboard-user">
        <div class="dashboard-user__avatar">U</div>
        <div class="dashboard-user__info">
          <span class="dashboard-user__name" id="usuario-nombre">Usuario</span>
          <span class="dashboard-user__rol" id="usuario-rol">Rol</span>
        </div>
      </div>

      <button type="button" class="btn btn-logout" id="btn-logout">
        Cerrar sesión
      </button>
    </header>

    <!-- Resumen arriba -->
    <div class="dashboard-resumen">
      <div class="resumen-card">
        <p class="resumen-card__label">Doctores</p>
        <p class="resumen-card__valor" id="stat-doctores">5</p>
      </div>
      <div class="resumen-card">
        <p class="resumen-card__label">Tratamientos activos</p>
        <p class="resumen-card__valor" id="stat-tratamientos">4</p>
      </div>
    </div>

    <hr class="nm-divider" />

    <main class="dashboard-main">
      <!-- Componente pequeño de citas -->
      <section class="citas-componente">
        <header class="citas-header">
          <h2 class="citas-title">Citas</h2>
        </header>

        <div class="citas-estados">
          <button type="button" class="estado-btn" id="btn-estado-pendiente">
            <span class="estado-btn__label">Pendientes</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-confirmada">
            <span class="estado-btn__label">Confirmadas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-completada">
            <span class="estado-btn__label">Completadas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-cancelada">
            <span class="estado-btn__label">Canceladas</span>
          </button>
          <button type="button" class="estado-btn" id="btn-estado-total">
            <span class="estado-btn__label">Todas</span>
          </button>
        </div>

        <div class="citas-total">
          <span class="citas-total__label">Total citas:</span>
          <span class="citas-total__numero" id="citas-total">10</span>
        </div>
      </section>

      <!-- Búsqueda y tabla de pacientes -->
      <section class="pacientes-seccion">
        <header class="pacientes-header">
          <h2 class="pacientes-title">Pacientes</h2>
        </header>

        <div class="pacientes-filtros">
          <div class="filtro-buscar">
            <label for="buscar-paciente">Buscar por nombre</label>
            <input
              type="search"
              id="buscar-paciente"
              placeholder="Escribe nombre o apellido…"
              aria-label="Buscar paciente por nombre"
              class="input"
            />
          </div>

          <div class="filtro-tipo">
            <label for="filtro-tipo-paciente">Tipo de paciente</label>
            <select
              id="filtro-tipo-paciente"
              aria-label="Filtrar por tipo de paciente"
              class="input"
            >
              <option value="">Todos los tipos</option>
              <option value="urgencia">Urgencia</option>
              <option value="planta">Planta</option>
              <option value="casa">Casa</option>
            </select>
          </div>
        </div>

        <div class="pacientes-tabla-wrap">
          <table class="pacientes-tabla">
            <caption>Pacientes registrados</caption>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Tipo</th>
                <th>Tratamiento</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
