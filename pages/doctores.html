<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA — Gestión de Doctores</title>
  <link rel="icon" type="image/jpeg" href="../public/favicon.jpg" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/doctores.css" />
  <script src="../js/utils.js"></script>
  <script src="../js/pages/doctores.js" type="module"></script>
</head>
<body>
  <div class="doctores-container">
    <!-- Overlay del menú lateral -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Panel vertical de navegación -->
    <nav class="sidebar-panel" id="sidebar-panel">
      <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">✕</button>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link sidebar-link--active">Panel Principal</a></li>
        <li><a href="citas.html" class="sidebar-link">Citas</a></li>
        <li><a href="pacientes.html" class="sidebar-link">Pacientes</a></li>
        <li><a href="tratamientos.html" class="sidebar-link">Tratamientos</a></li>
      </ul>
    </nav>

    <header class="doctores-header">
      <div class="doctores-brand">
        <button class="btn-hamburger" id="btn-hamburger" aria-label="Abrir menú de navegación">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <div class="doctores-logo nm-sign" style="--r: var(--r-md);">
          <img src="../public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="doctores-title">Gestión de Doctores</h1>
      </div>

      <div class="doctores-user">
        <div class="doctores-user__avatar" id="user__avatar">U</div>
        <div class="doctores-user__info">
          <span class="doctores-user__name" id="usuario-nombre">Usuario</span>
          <span class="doctores-user__rol" id="usuario-rol">Rol</span>
        </div>
      </div>

      <button type="button" class="btn btn-logout" id="btn-logout">
        Cerrar sesión
      </button>
    </header>

    <!-- Formulario nuevo doctor (horizontal, arriba del main) -->
    <section class="doctores-nuevo-form">
      <form id="form-nuevo-medico" novalidate>
        <div class="field">
          <label for="nuevo-nombre">Nombre</label>
          <input
            type="text"
            id="nuevo-nombre"
            name="nuevo-nombre"
            placeholder="Juan"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            minlength="2"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-apellidos">Apellidos</label>
          <input
            type="text"
            id="nuevo-apellidos"
            name="nuevo-apellidos"
            placeholder="García López"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            minlength="2"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-dni">DNI</label>
          <input
            type="text"
            id="nuevo-dni"
            name="nuevo-dni"
            placeholder="12345678A"
            required
            pattern="^[0-9]{8}[A-Z]$"
            maxlength="9"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-especialidad">Especialidad</label>
          <input
            type="text"
            id="nuevo-especialidad"
            name="nuevo-especialidad"
            placeholder="Cardiología"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            minlength="2"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-departamento">Departamento</label>
          <select
            id="nuevo-departamento"
            name="nuevo-departamento"
            required
            class="input"
          >
            <option value="">Seleccionar departamento</option>
            <option value="D001">Cardiología</option>
            <option value="D002">Pediatría</option>
            <option value="D003">Odontología</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary">Crear doctor</button>
      </form>
    </section>

    <main class="doctores-main">
      <!-- Columna izquierda: detalle del doctor seleccionado -->
      <medico-detalle></medico-detalle>

      <!-- Columna derecha: tabla de doctores con filtros -->
      <section class="doctores-tabla-seccion">
        <div class="doctores-filtros">
          <div class="filtro-buscar">
            <label for="buscar-medico">Buscar por nombre</label>
            <input
              type="search"
              id="buscar-medico"
              placeholder="Escribe nombre o apellido…"
              aria-label="Buscar doctor por nombre"
              class="input"
            />
          </div>
          <div class="filtro-departamento">
            <label for="filtro-departamento-medico">Departamento</label>
            <select
              id="filtro-departamento-medico"
              aria-label="Filtrar por departamento"
              class="input"
            >
              <option value="">Todos los departamentos</option>
              <option value="D001">Cardiología</option>
              <option value="D002">Pediatría</option>
              <option value="D003">Odontología</option>
            </select>
          </div>
        </div>

        <div class="doctores-tabla-wrap">
          <table class="doctores-tabla">
            <caption>Listado de doctores</caption>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Especialidad</th>
                <th>Departamento</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
