<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCRUDA — Gestión de Pacientes</title>
  <link rel="icon" type="image/jpeg" href="../public/favicon.jpg" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/pacientes.css" />
  <script src="../js/utils.js"></script>
  <script src="../js/pages/pacientes.js" type="module"></script>
</head>
<body>
  <div class="pacientes-container">
    <!-- Overlay del menú lateral -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Panel vertical de navegación -->
    <nav class="sidebar-panel" id="sidebar-panel">
      <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú">✕</button>
      <ul class="sidebar-menu">
        <li><a href="dashboard.html" class="sidebar-link sidebar-link--active">Panel Principal</a></li>
        <li><a href="citas.html" class="sidebar-link">Citas</a></li>
        <li><a href="doctores.html" class="sidebar-link">Doctores</a></li>
        <li><a href="tratamientos.html" class="sidebar-link">Tratamientos</a></li>
      </ul>
    </nav>

    <header class="pacientes-header">
      <div class="pacientes-brand">
        <button class="btn-hamburger" id="btn-hamburger" aria-label="Abrir menú de navegación">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <div class="pacientes-logo nm-sign" style="--r: var(--r-md);">
          <img src="../public/favicon.jpg" alt="Logo HCRUDA" />
        </div>
        <h1 class="pacientes-title">Gestión de Pacientes</h1>
      </div>

      <div class="pacientes-user">
        <div class="pacientes-user__avatar" id="user__avatar">U</div>
        <div class="pacientes-user__info">
          <span class="pacientes-user__name" id="usuario-nombre">Usuario</span>
          <span class="pacientes-user__rol" id="usuario-rol">Rol</span>
        </div>
      </div>

      <button type="button" class="btn btn-logout" id="btn-logout">
        Cerrar sesión
      </button>
    </header>

    <!-- Formulario nuevo paciente (horizontal, arriba del main) -->
    <section class="pacientes-nuevo-form">
      <form id="form-nuevo-paciente" novalidate>
        <div class="field">
          <label for="nuevo-nombre">Nombre</label>
          <input
            type="text"
            id="nuevo-nombre"
            name="nuevo-nombre"
            placeholder="Luis"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            minlength="2"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-apellidos">Apellidos</label>
          <input
            type="text"
            id="nuevo-apellidos"
            name="nuevo-apellidos"
            placeholder="Martín Hernández"
            required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
            minlength="2"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-dni">DNI</label>
          <input
            type="text"
            id="nuevo-dni"
            name="nuevo-dni"
            placeholder="12345678A"
            required
            pattern="^[0-9]{8}[A-Z]$"
            maxlength="9"
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-telefono">Teléfono</label>
          <input
            type="tel"
            id="nuevo-telefono"
            name="nuevo-telefono"
            placeholder="600 111 222"
            required
            class="input"
          />
        </div>
        <div class="field">
          <label for="nuevo-tipo">Tipo</label>
          <select
            id="nuevo-tipo"
            name="nuevo-tipo"
            required
            class="input"
          >
            <option value="urgencia">Urgencia</option>
            <option value="planta">Planta</option>
            <option value="casa">Casa</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary">Crear paciente</button>
      </form>
    </section>

    <main class="pacientes-main">
      <!-- Columna izquierda: detalle del paciente seleccionado -->
      <paciente-detalle></paciente-detalle>

      <!-- Columna derecha: tabla de pacientes con filtros -->
      <section class="pacientes-tabla-seccion">
        <div class="pacientes-filtros">
          <div class="filtro-buscar">
            <label for="buscar-paciente">Buscar por nombre</label>
            <input
              type="search"
              id="buscar-paciente"
              placeholder="Escribe nombre o apellido…"
              aria-label="Buscar paciente por nombre"
              class="input"
            />
          </div>
          <div class="filtro-tipo">
            <label for="filtro-tipo-paciente">Tipo de paciente</label>
            <select
              id="filtro-tipo-paciente"
              aria-label="Filtrar por tipo de paciente"
              class="input"
            >
              <option value="">Todos los tipos</option>
              <option value="urgencia">Urgencia</option>
              <option value="planta">Planta</option>
              <option value="casa">Casa</option>
            </select>
          </div>
        </div>

        <div class="pacientes-tabla-wrap">
          <table class="pacientes-tabla">
            <caption>Listado de pacientes</caption>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>DNI</th>
                <th>Teléfono</th>
                <th>Tipo</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
